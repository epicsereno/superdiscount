<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qué vendemos — Super Discount El Sereno</title>
<meta name="description" content="Pintura en aerosol, marcadores, sodas exóticas, artículos de fiesta y servicios de mostrador. Super Discount El Sereno, desde 1998 en 3118 N Eastern Ave, Los Angeles.">
<link rel="canonical" href="https://epicsereno.github.io/superdiscount/catalog.html">

<meta property="og:type" content="website">
<meta property="og:title" content="Qué vendemos — Super Discount El Sereno">
<meta property="og:description" content="Pintura, marcadores, sodas exóticas y lo del diario. Desde 1998 en Eastern Ave.">
<meta property="og:url" content="https://epicsereno.github.io/superdiscount/catalog.html">
<meta property="og:image" content="https://epicsereno.github.io/superdiscount/assets/images/og-cover.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Kaushan+Script&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0A0A0A;
  --ink-2:#141414;
  --ink-3:#1E1E1E;
  --red:#F60513;
  --gold:#B39E3D;
  --paper:#F8F8F8;
  --muted:#9A9A9A;
  --line:#2A2A2A;
  --pad:clamp(16px,4vw,32px);
  --display:"Barlow Condensed",system-ui,sans-serif;
  --body:"DM Sans",system-ui,sans-serif;
  --script:"Kaushan Script",cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ink);
  color:var(--paper);
  font-family:var(--body);
  font-size:16px;
  line-height:1.55;
  padding-bottom:76px;
}
a{color:inherit}
img{max-width:100%;display:block}

.wrap{max-width:1120px;margin:0 auto;padding-inline:var(--pad)}

/* ---- top bar ---- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(10,10,10,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar .wrap{display:flex;align-items:center;gap:16px;min-height:56px}
.home{
  font-family:var(--display);
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:700;
  font-size:15px;
  text-decoration:none;
  color:var(--muted);
  white-space:nowrap;
}
.home:hover{color:var(--paper)}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---- hero ---- */
.hero{padding:clamp(40px,9vw,88px) 0 clamp(28px,5vw,44px);border-bottom:1px solid var(--line)}
.mark{line-height:.82;margin:0 0 20px}
.mark .super{
  display:block;
  font-family:var(--script);
  color:var(--gold);
  font-size:clamp(30px,7vw,54px);
  transform:translateX(.08em);
  line-height:1.1;
}
.mark .disc{
  display:block;
  font-family:var(--display);
  font-weight:800;
  color:var(--red);
  font-size:clamp(54px,15vw,132px);
  letter-spacing:-.005em;
  text-transform:uppercase;
}
.mark .sereno{
  display:block;
  font-family:var(--display);
  font-weight:700;
  color:var(--paper);
  text-transform:uppercase;
  letter-spacing:.34em;
  font-size:clamp(13px,2.6vw,20px);
  margin-top:10px;
}
.rule{height:2px;background:linear-gradient(90deg,var(--gold),rgba(179,158,61,0));max-width:340px;margin:14px 0 0}
.tagline{color:var(--gold);font-size:14px;letter-spacing:.06em;margin:20px 0 6px;text-transform:uppercase;font-family:var(--display);font-weight:700}
.lede{font-size:clamp(17px,2.6vw,21px);max-width:46ch;color:#D8D8D8;margin:0}

/* ---- status ---- */
.status{display:flex;align-items:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:#3FD07A;box-shadow:0 0 0 4px rgba(63,208,122,.16)}
.dot.off{background:#7A7A7A}
.status-txt{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-weight:700;font-size:15px}
.status-sub{color:var(--muted);font-size:14px}

/* ---- banners ---- */
.banner{display:block;width:100%;border-bottom:1px solid var(--line);background:var(--ink-3)}
.banner img{width:100%;height:auto;display:block;aspect-ratio:1568/400;object-fit:cover}
.svc-banner{margin:0 0 22px;border:1px solid var(--line);border-radius:3px;overflow:hidden;max-width:420px}
.svc-banner img{width:100%;height:auto;display:block;aspect-ratio:4/3;object-fit:cover}

/* ---- nav chips ---- */
.jump{border-bottom:1px solid var(--line);background:var(--ink-2)}
.jump .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.jump .wrap::-webkit-scrollbar{display:none}
.chip{
  font-family:var(--display);text-transform:uppercase;font-weight:700;
  letter-spacing:.07em;font-size:14px;white-space:nowrap;
  padding:8px 14px;border:1px solid var(--line);border-radius:2px;
  text-decoration:none;color:#CFCFCF;background:var(--ink);min-height:36px;
  display:inline-flex;align-items:center;
}
.chip:hover{border-color:var(--gold);color:var(--paper)}

/* ---- notice ---- */
.notice{border-bottom:1px solid var(--line);padding:clamp(28px,5vw,44px) 0;background:var(--ink-2)}
.notice h2{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:clamp(20px,3.4vw,26px);margin:0 0 8px;color:var(--gold)}
.notice p{margin:0;max-width:56ch;color:#C8C8C8}

/* ---- category ---- */
.cat{padding:clamp(34px,6vw,62px) 0;border-bottom:1px solid var(--line)}
.cat-head{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.cat h2{
  font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(28px,6vw,50px);letter-spacing:-.01em;margin:0;line-height:.95;
}
.cat .blurb{margin:0;color:var(--muted);max-width:52ch}
.band{display:flex;height:8px;border-radius:2px;overflow:hidden;max-width:520px}
.band span{flex:1}
.badge{
  display:inline-block;font-family:var(--display);text-transform:uppercase;
  font-weight:700;letter-spacing:.1em;font-size:12px;
  border:1px solid var(--gold);color:var(--gold);
  padding:4px 9px;border-radius:2px;align-self:flex-start;
}

.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr}}

.tile{
  background:var(--ink-2);border:1px solid var(--line);border-radius:3px;
  overflow:hidden;display:flex;flex-direction:column;
}
.media{position:relative;flex:none;aspect-ratio:4/3;background:var(--ink-3);overflow:hidden}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.media.swatch::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.42));
}
.tile:hover .media img{transform:scale(1.03)}
.media img{transition:transform .35s ease}
.tile-body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.tile h3{font-family:var(--display);text-transform:uppercase;font-weight:700;font-size:20px;letter-spacing:.02em;margin:0;line-height:1.15}
.tile p{margin:0;font-size:14.5px;color:#BFBFBF}
.tag{
  margin-top:auto;font-family:var(--display);text-transform:uppercase;
  font-weight:700;letter-spacing:.09em;font-size:12px;color:var(--gold);
}

/* ---- services ---- */
.svc{padding:clamp(34px,6vw,62px) 0;border-bottom:1px solid var(--line)}
.svc h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(26px,5vw,42px);margin:0 0 22px}
.svc ul{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
@media(min-width:700px){.svc ul{grid-template-columns:1fr 1fr}}
.svc li{background:var(--ink-2);padding:16px 18px;display:flex;gap:14px;align-items:baseline}
.svc .n{font-family:var(--display);font-weight:800;color:var(--red);font-size:18px;min-width:1.4em}
.svc .t{font-family:var(--display);text-transform:uppercase;font-weight:700;letter-spacing:.04em;font-size:18px}
.svc .d{color:var(--muted);font-size:14px;margin-left:auto;text-align:right}

/* ---- visit ---- */
.visit{padding:clamp(34px,6vw,64px) 0}
.visit h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(26px,5vw,42px);margin:0 0 18px}
.addr{font-size:18px;line-height:1.7;margin:0 0 6px}
.addr strong{font-family:var(--display);font-size:22px;letter-spacing:.02em;font-weight:700}
.hours{color:var(--gold);margin:0 0 22px}
.ig{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.ig:hover{color:var(--paper)}

/* ---- action bar ---- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--line);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.bar a{
  background:var(--ink-2);color:var(--paper);text-decoration:none;
  font-family:var(--display);text-transform:uppercase;font-weight:700;
  letter-spacing:.1em;font-size:15px;
  display:flex;align-items:center;justify-content:center;
  min-height:56px;padding:8px;
}
.bar a.primary{background:var(--red)}
.bar a:hover{filter:brightness(1.12)}

footer{border-top:1px solid var(--line);padding:26px 0 34px;color:var(--muted);font-size:13px}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
html{scroll-behavior:smooth}
:target{scroll-margin-top:120px}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="home" href="./index.html">← Super Discount</a>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1 class="mark">
        <span class="super">Super</span>
        <span class="disc">Discount</span>
        <span class="sereno">El Sereno</span>
      </h1>
      <div class="rule"></div>
      <p class="tagline" data-ui="tagline"></p>
      <p class="lede" data-ui="lede"></p>
      <div class="status">
        <span class="dot" id="dot" aria-hidden="true"></span>
        <span class="status-txt" id="statusTxt"></span>
        <span class="status-sub" id="statusSub"></span>
      </div>
    </div>
  </section>

  <div class="banner">
    <picture>
      <source type="image/webp" srcset="assets/catalog/hero-640.webp 640w, assets/catalog/hero-1120.webp 1120w, assets/catalog/hero-1568.webp 1568w" sizes="100vw">
      <img src="assets/catalog/hero-1120.jpg"
           srcset="assets/catalog/hero-640.jpg 640w, assets/catalog/hero-1120.jpg 1120w, assets/catalog/hero-1568.jpg 1568w"
           sizes="100vw" width="1568" height="400" fetchpriority="high" decoding="async"
           alt="Latas de pintura en aerosol Super Discount El Sereno">
    </picture>
  </div>

  <nav class="jump" aria-label="Categorías">
    <div class="wrap" id="chips"></div>
  </nav>

  <section class="notice">
    <div class="wrap">
      <h2 data-ui="noPricesTitle"></h2>
      <p data-ui="noPrices"></p>
    </div>
  </section>

  <div id="cats"></div>

  <section class="svc">
    <div class="wrap">
      <h2 data-ui="servicesTitle"></h2>
      <div class="svc-banner">
        <picture>
          <source type="image/webp" srcset="assets/catalog/services-banner-480.webp">
          <img src="assets/catalog/services-banner-480.jpg" width="480" height="360"
               loading="lazy" decoding="async" alt="Copias, fax y llaves">
        </picture>
      </div>
      <ul id="svcList"></ul>
    </div>
  </section>

  <section class="visit" id="visit">
    <div class="wrap">
      <h2 data-ui="visit"></h2>
      <p class="addr">
        <strong>3118 N Eastern Ave</strong><br>
        Los Angeles, CA 90032
      </p>
      <p class="hours" data-ui="hoursLabel"></p>
      <a class="ig" href="https://instagram.com/superdiscount.99" rel="noopener">@superdiscount.99</a>
    </div>
  </section>
</main>

<nav class="bar" aria-label="Contacto">
  <a href="tel:+13232238115" data-ui="call"></a>
  <a class="primary" href="https://maps.google.com/?q=3118+N+Eastern+Ave,+Los+Angeles,+CA+90032" rel="noopener" data-ui="directions"></a>
</nav>

<footer>
  <div class="wrap">Super Discount El Sereno · Est. 1998 · (323) 223-8115</div>
</footer>

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"Store",
  "name":"Super Discount El Sereno",
  "foundingDate":"1998",
  "image":"https://epicsereno.github.io/superdiscount/assets/images/og-cover.png",
  "url":"https://epicsereno.github.io/superdiscount/",
  "telephone":"+1-323-223-8115",
  "address":{
    "@type":"PostalAddress",
    "streetAddress":"3118 N Eastern Ave",
    "addressLocality":"Los Angeles",
    "addressRegion":"CA",
    "postalCode":"90032",
    "addressCountry":"US"
  },
  "geo":{"@type":"GeoCoordinates","latitude":34.0815,"longitude":-118.1778},
  "openingHoursSpecification":[{
    "@type":"OpeningHoursSpecification",
    "dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
    "opens":"09:30","closes":"21:00"
  }],
  "sameAs":["https://instagram.com/superdiscount.99"]
}
</script>

<script>
(function(){
  var DATA=null, lang='es';

  function t(k){ return (DATA && DATA.ui[lang] && DATA.ui[lang][k]) || ''; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  }); }

  function renderStatic(){
    document.querySelectorAll('[data-ui]').forEach(function(el){
      el.textContent = t(el.getAttribute('data-ui'));
    });
    document.documentElement.lang = lang;
  }

  function renderStatus(){
    var now=new Date();
    // Store hours are local to Los Angeles; read the visitor's clock in that zone.
    var la=new Date(now.toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
    var mins=la.getHours()*60+la.getMinutes();
    var open=(mins>=570 && mins<1260); // 9:30 -> 21:00
    var dot=document.getElementById('dot');
    dot.className='dot '+(open?'on':'off');
    document.getElementById('statusTxt').textContent = open?t('openNow'):t('closedNow');
    document.getElementById('statusSub').textContent = open?t('closesAt'):t('opensAt');
  }

  function renderChips(){
    var box=document.getElementById('chips');
    box.innerHTML = DATA.categories.map(function(c){
      return '<a class="chip" href="#'+c.id+'">'+esc(c.name[lang])+'</a>';
    }).join('') + '<a class="chip" href="#visit">'+esc(t('visit'))+'</a>';
  }

  function renderCats(){
    document.getElementById('cats').innerHTML = DATA.categories.map(function(c){
      var band = c.swatches.map(function(s){
        return '<span style="background:'+esc(s)+'"></span>';
      }).join('');

      var badge = c.restricted ? '<span class="badge">'+esc(t('ageGate'))+'</span>' : '';

      var tiles = c.products.map(function(p){
        var media;
        if(p.img && p.widths && p.widths.length){
          var base=DATA.meta.images.path+p.img;
          var webp=p.widths.map(function(w){return base+'-'+w+'.webp '+w+'w';}).join(', ');
          var jpg =p.widths.map(function(w){return base+'-'+w+'.jpg '+w+'w';}).join(', ');
          var big =p.widths[p.widths.length-1];
          media='<div class="media"><picture>'
            + '<source type="image/webp" srcset="'+webp+'" sizes="(min-width:900px) 340px, (min-width:600px) 46vw, 92vw">'
            + '<img src="'+base+'-'+big+'.jpg" srcset="'+jpg+'" '
            + 'sizes="(min-width:900px) 340px, (min-width:600px) 46vw, 92vw" '
            + 'loading="lazy" decoding="async" width="'+big+'" height="'+Math.round(big*0.75)+'" '
            + 'alt="'+esc(p.name[lang])+'">'
            + '</picture></div>';
        } else {
          media='<div class="media swatch" style="background:'+esc(p.color)+'"></div>';
        }
        return '<article class="tile">'
          + media
          + '<div class="tile-body">'
          + '<h3>'+esc(p.name[lang])+'</h3>'
          + '<p>'+esc(p.desc[lang])+'</p>'
          + '<span class="tag">'+esc(t(p.note))+'</span>'
          + '</div></article>';
      }).join('');

      return '<section class="cat" id="'+c.id+'"><div class="wrap">'
        + '<div class="cat-head">'
        + '<div class="band" aria-hidden="true">'+band+'</div>'
        + '<h2>'+esc(c.name[lang])+'</h2>'
        + '<p class="blurb">'+esc(c.blurb[lang])+'</p>'
        + badge
        + '</div>'
        + '<div class="grid">'+tiles+'</div>'
        + '</div></section>';
    }).join('');
  }

  function renderSvc(){
    document.getElementById('svcList').innerHTML = DATA.services.map(function(s,i){
      return '<li>'
        + '<span class="n">'+String(i+1).padStart(2,'0')+'</span>'
        + '<span class="t">'+esc(s.name[lang])+'</span>'
        + '<span class="d">'+esc(s.desc[lang])+'</span>'
        + '</li>';
    }).join('');
  }

  function renderAll(){
    renderStatic(); renderStatus(); renderChips(); renderCats(); renderSvc();
  }

  try{
    var saved=localStorage.getItem('sd-lang');
    if(saved==='en'||saved==='vi'||saved==='es'){
      lang=saved;
    }
  }catch(e){}

  fetch('data/catalog.json')
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){ DATA=j; renderAll(); setInterval(renderStatus,60000); })
    .catch(function(){
      document.getElementById('cats').innerHTML =
        '<section class="cat"><div class="wrap"><h2>3118 N Eastern Ave</h2>'
        + '<p class="blurb">Los Angeles, CA 90032 · (323) 223-8115 · 9:30 AM – 9:00 PM</p>'
        + '</div></section>';
    });
})();
</script>
</body>
</html>
